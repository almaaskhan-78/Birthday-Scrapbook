<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Match 💖</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="game-container">

    <h1>Memory Match 🌸</h1>

    <p id="msg">Find all the matching pairs 💖</p>

    <div class="grid" id="grid"></div>

    <button id="nextBtn" onclick="window.location.href='photo.html'">
        Continue →
    </button>

</div>
<style>body{
    margin:0;
    font-family:'Nunito',sans-serif;
    background:linear-gradient(135deg,#ffe4ec,#ffd6e0);
    text-align:center;
}

h1{
    font-family:'Pacifico',cursive;
    margin-top:30px;
    font-size:40px;
}

#msg{
    font-size:22px;
    margin:20px;
}

#grid{
    display:grid;
    grid-template-columns:repeat(5,80px);
    gap:15px;
    justify-content:center;
    margin-top:30px;
}

.card{
    width:80px;
    height:80px;

    background:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:32px;

    border-radius:15px;

    cursor:pointer;

    box-shadow:0 5px 15px rgba(0,0,0,.12);

    transition:.25s;
}

.card:hover{
    transform:scale(1.08);
}

#nextBtn{
    display:none;
    margin-top:30px;
    padding:12px 28px;
    border:none;
    border-radius:25px;
    background:#ff6b8a;
    color:white;
    font-size:18px;
    cursor:pointer;
}
@media (max-width: 480px) {
    h1{
        font-size:28px;
        margin-top:20px;
    }
    #msg{
        font-size:18px;
        margin:15px;
    }
    #grid{
        grid-template-columns:repeat(4,65px);
        gap:10px;
        margin-top:20px;
    }
    .card{
        width:65px;
        height:65px;
        font-size:24px;
        border-radius:10px;
    }
    #nextBtn{
        margin-top:20px;
        padding:10px 22px;
        font-size:16px;
    }
}
</style>

<script src="js/script.js"></script>

</body>

</html>
